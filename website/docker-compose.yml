services:
  mysql:
    image: mysql:8.0
    container_name: website_mysql
    restart: unless-stopped
    ports:
      - "3312:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: website_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: website_backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./docker/backend.env:/var/www/html/.env:ro
    # NOTE: no `environment:` block here on purpose. Runtime config comes
    # from docker/backend.env (mounted as .env). Real container env vars
    # would shadow phpunit.xml <env> overrides and break test DB selection.
    command: php artisan serve --host=0.0.0.0 --port=8002

volumes:
  mysql_data:
